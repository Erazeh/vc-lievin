name: Mise à jour FFVB

on:
  schedule:
    - cron: '15 4 * * *'     # chaque matin (≈ 6 h à Paris)
    - cron: '0 18 * * 0'     # dimanche soir, après les matchs de l'après-midi
    - cron: '30 22 * * 6,0'  # samedi et dimanche soir, après les matchs du soir
  workflow_dispatch:         # bouton « Run workflow » pour forcer une mise à jour
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les données FFVB
        # Si la FFVB est injoignable, on publie quand même le site avec les données de la veille.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/update.mjs

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calendar
          git diff --cached --quiet || git commit -m "Données FFVB du $(TZ=Europe/Paris date +'%d/%m/%Y %H:%M')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4
