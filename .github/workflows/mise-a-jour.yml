name: Mise à jour FFVB

on:
  # Déclencheur principal : le service de notifications (Cloudflare), ponctuel, le matin et les soirs de match.
  workflow_dispatch:
    inputs:
      mode:
        description: "full = tout relire, quick = calendrier et classement seulement"
        type: choice
        options: [full, quick]
        default: full
  # Filet de sécurité si le service ne déclenche rien (GitHub peut retarder ces créneaux de plusieurs heures).
  schedule:
    - cron: '15 4 * * *'
    - cron: '30 22 * * 6,0'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Récupérer les données FFVB
        # Si la FFVB est injoignable, on publie quand même le site avec les données de la veille.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/update.mjs ${{ inputs.mode == 'quick' && '--quick' || '' }}

      - name: Image d'aperçu des liens
        run: node scripts/og.mjs

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calendar assets/og.png index.html
          git diff --cached --quiet || git commit -m "Données FFVB du $(TZ=Europe/Paris date +'%d/%m/%Y %H:%M')"
          git pull --rebase --autostash && git push

      - name: Ne pas publier les outils
        run: rm -rf node_modules

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # GitHub met parfois quelques secondes à rendre visible le paquet tout juste envoyé : on réessaie une fois.
      - id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Patienter avant de réessayer
        if: steps.deploiement.outcome == 'failure'
        run: sleep 20

      - id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Prévenir le service de notifications
        env:
          KEY: ${{ secrets.PUSH_REFRESH_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          curl -fsS -m 20 -X POST "$(jq -r .pushApi site.config.json)/refresh" -H "x-key: $KEY" || true

      - name: Signaler l'échec à l'administrateur
        if: failure()
        env:
          KEY: ${{ secrets.PUSH_REFRESH_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          curl -fsS -m 20 -X POST "$(jq -r .pushApi site.config.json)/alert" -H "x-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"message\":\"Le workflow « ${{ github.workflow }} » a échoué (déclenché par ${{ github.event_name }}).\"}" || true
